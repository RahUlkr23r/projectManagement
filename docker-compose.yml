version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: velozity_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: velozity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d velozity_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: velozity_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/velozity_db?schema=public
      JWT_ACCESS_SECRET: prod_access_super_secret_key_32_characters_long_min
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_SECRET: prod_refresh_super_secret_key_32_characters_long_min
      JWT_REFRESH_EXPIRY_DAYS: 7
      COOKIE_SECRET: prod_cookie_super_secret_signing_key_32_characters
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: velozity_client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
